<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Level Requests</title>
  <style>
    :root {
      --bg-color: #08080c;
      --card-bg: #12131a;
      --border-color: #ff0055;
      --accent-cyan: #00f0ff;
      --accent-pink: #ff0055;
      --text-color: #e1e1e6;
      --subtext-color: #8a8a9e;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 850px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
      background-image: radial-gradient(circle at 50% 0%, #1a002b 0%, #08080c 70%);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    h1 {
      color: var(--accent-cyan);
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7), 0 0 20px rgba(0, 240, 255, 0.4);
      font-size: 2.5rem;
    }

    .description {
      color: var(--accent-pink);
      font-size: 1.1rem;
      margin: 0;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.6);
      font-weight: bold;
    }

    /* Video & Teaser Wrapper */
    .video-wrapper {
      background: var(--card-bg);
      border: 2px solid var(--accent-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 30px;
      position: relative;
    }

    .teaser-box {
      width: 100%;
      height: 220px;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .glitch-text {
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--accent-cyan);
      text-shadow: 0 0 10px var(--accent-cyan);
      letter-spacing: 3px;
    }

    .teaser-box p {
      color: var(--accent-pink);
      margin-top: 8px;
      font-size: 0.95rem;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .video-controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 12px 16px;
      background: #0d0e14;
      flex-wrap: wrap;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--accent-cyan);
      font-weight: bold;
      font-size: 0.9rem;
    }

    .volume-control input[type=range] {
      accent-color: var(--accent-cyan);
      cursor: pointer;
    }

    .video-actions {
      display: flex;
      gap: 10px;
    }

    .cyber-btn {
      background: transparent;
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      padding: 8px 14px;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      text-shadow: 0 0 5px var(--accent-cyan);
      box-shadow: inset 0 0 5px rgba(0, 240, 255, 0.2);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .cyber-btn:hover {
      background: var(--accent-cyan);
      color: #000;
      box-shadow: 0 0 12px var(--accent-cyan);
      text-shadow: none;
    }

    .cyber-btn.pink {
      border-color: var(--accent-pink);
      color: var(--accent-pink);
      text-shadow: 0 0 5px var(--accent-pink);
    }

    .cyber-btn.pink:hover {
      background: var(--accent-pink);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-pink);
    }

    /* Cyber Card Styling */
    .cyber-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.2);
      padding: 20px;
      margin-bottom: 30px;
      clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
    }

    .cyber-section h3 {
      color: var(--accent-pink);
      margin-top: 0;
      text-shadow: 0 0 8px var(--accent-pink);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    @media (max-width: 600px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    input, textarea {
      background: #090a0f;
      border: 1px solid #29293d;
      color: #fff;
      padding: 12px;
      border-radius: 2px;
      font-family: inherit;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent-cyan);
      box-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
    }

    button.submit-btn {
      background: var(--accent-pink);
      color: #fff;
      border: none;
      padding: 12px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s;
      box-shadow: 0 0 10px rgba(255, 0, 85, 0.4);
    }

    button.submit-btn:hover {
      background: #ff3377;
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.8);
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .comment-card {
      background: #090a0f;
      border: 1px solid #1f1f2e;
      border-left: 3px solid var(--accent-cyan);
      padding: 14px;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--accent-cyan);
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .username {
      font-weight: bold;
      color: var(--accent-cyan);
    }

    .comment-text {
      margin: 0 0 10px 0;
      color: var(--text-color);
      word-break: break-word;
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid var(--border-color);
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-cyan);
      text-decoration: none;
      margin-left: 6px;
      font-weight: bold;
    }

    footer a:hover {
      text-shadow: 0 0 8px var(--accent-cyan);
    }
  </style>
</head>
<body>

  <header>
    <h1>GD Level Requests</h1>
    <p class="description">Wait until 2.21 for the results</p>
<p>Just playing for fun. It's NEVER ending</p>
  </header>

  <div class="video-wrapper">
<video controls style="width: 100%; height: auto; display: block; max-height: 480px;">
  <source src="InShot_20260919_104820570_(1) (1).mp4" type="video/mp4">
  Your browser does not support the video tag.
</video>
    <div class="video-controls-bar">
      <div class="volume-control">
        <span>🔊 VOL</span>
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="1">
      </div>
      <div class="video-actions">
        <button class="cyber-btn pink" id="like-video-btn">
          ❤️ LIKE VIDEO (<span id="video-like-count">0</span>)
        </button>
        <a href="InShot_20260919_104820570_(1) (1).mp4" download="InShot_20260919_104820570_(1) (1).mp4" class="cyber-btn">
          💾 DOWNLOAD
        </a>
      </div>
    </div>
  </div>

  <section class="cyber-section">
    <h3>Submit Level ID</h3>
    <form class="comment-form" id="level-submit-form">
      <div class="form-grid">
        <input type="text" id="level-username" placeholder="Username" required>
        <input type="text" id="level-id" placeholder="9-Digit Level ID (e.g. )" maxlength="9" pattern="\d{9}" title="Must be exactly 9 digits" required>
      </div>
      <button type="submit" class="submit-btn" style="background: var(--accent-cyan); color: #000;">Submit Level ID</button>
    </form>
  </section>

  <section class="cyber-section">
    <h3>Comments & Discussions</h3>
    
    <form class="comment-form" id="comment-form">
      <input type="text" id="username" placeholder="Username (Optional, defaults to Anonymous)">
      <input type="url" id="pfp" placeholder="PFP Image URL (Optional)">
      <textarea id="comment-text" placeholder="Write your request or comment..." rows="3" required></textarea>
      <button type="submit" class="submit-btn">Post Comment</button>
    </form>

    <div class="comments-list" id="comments-list"></div>
  </section>

  <footer>
    KrisPolaris 2024-2026 | <a href="https://tinyurl.com/bebzun" target="_blank" rel="noopener noreferrer">Dont ask</a>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      doc, 
      setDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp,
      increment 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      projectId: "bebechchat",
      authDomain: "bebechchat.firebaseapp.com",
      apiKey: "YOUR_FIREBASE_API_KEY" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const commentsCol = collection(db, "comments");
    const likesCol = collection(db, "comments", "likes", "counts");
    const videoStatsDoc = doc(db, "video_stats", "main_video");

    const DEFAULT_AVATAR = "https://i.imgur.com/6VBx3io.png";

    // Real-time Video Likes listener
    onSnapshot(videoStatsDoc, (snap) => {
      const countSpan = document.getElementById("video-like-count");
      if (snap.exists()) {
        countSpan.innerText = snap.data().likes || 0;
      }
    });

    // Video Like Button Click
    document.getElementById("like-video-btn").addEventListener("click", async () => {
      await setDoc(videoStatsDoc, { likes: increment(1) }, { merge: true });
    });

    // Submit Level ID Form (Posts directly into comments feed)
    document.getElementById("level-submit-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("level-username").value.trim();
      const levelId = document.getElementById("level-id").value.trim();

      if (!username || !levelId) return;

      await addDoc(commentsCol, {
        username: username,
        pfp: "",
        text: `Level Request: ${levelId}`,
        createdAt: serverTimestamp()
      });

      document.getElementById("level-submit-form").reset();
    });

    // Submit Regular Comment Form
    document.getElementById("comment-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const pfp = document.getElementById("pfp").value.trim();
      const text = document.getElementById("comment-text").value.trim();

      if (!text) return;

      await addDoc(commentsCol, {
        username: username,
        pfp: pfp,
        text: text,
        createdAt: serverTimestamp()
      });

      document.getElementById("comment-form").reset();
    });

    // Real-time comments renderer
    const q = query(commentsCol, orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      const list = document.getElementById("comments-list");
      list.innerHTML = "";
      
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const commentId = docSnap.id;
        
        const card = document.createElement("div");
        card.className = "comment-card";
        
        const pfpSrc = data.pfp && data.pfp.trim() !== "" ? data.pfp : DEFAULT_AVATAR;
        const author = data.username && data.username.trim() !== "" ? data.username : "Anonymous";

        card.innerHTML = `
          <img class="avatar" src="${escapeHtml(pfpSrc)}" onerror="this.src='${DEFAULT_AVATAR}'" alt="PFP">
          <div class="comment-content">
            <div class="comment-header">
              <span class="username">${escapeHtml(author)}</span>
              <button class="cyber-btn pink" onclick="likeComment('${commentId}')">
                ❤️ <span id="like-count-${commentId}">0</span>
              </button>
            </div>
            <p class="comment-text">${escapeHtml(data.text)}</p>
          </div>
        `;
        list.appendChild(card);

        // Comment likes listener
        onSnapshot(doc(likesCol, commentId), (likeSnap) => {
          const countSpan = document.getElementById(`like-count-${commentId}`);
          if (countSpan) {
            countSpan.innerText = likeSnap.exists() ? (likeSnap.data().count || 0) : 0;
          }
        });
      });
    });

    window.likeComment = async function(commentId) {
      const likeRef = doc(likesCol, commentId);
      await setDoc(likeRef, { count: increment(1) }, { merge: true });
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
