<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GD Level Requests</title>
  <style>
    :root {
      --bg-color: #121214;
      --card-bg: #1a1a1e;
      --border-color: #29292e;
      --accent-color: #00f0ff;
      --text-color: #e1e1e6;
      --subtext-color: #a8a8b3;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      box-sizing: border-box;
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      color: var(--accent-color);
      margin-bottom: 8px;
    }

    .description {
      color: var(--subtext-color);
      font-size: 1.1rem;
      margin: 0;
    }

    .video-container {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    video {
      width: 100%;
      display: block;
    }

    .comments-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 40px;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    input, textarea {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.95rem;
    }

    input:focus, textarea:focus {
      outline: 1px solid var(--accent-color);
    }

    button.submit-btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s;
    }

    button.submit-btn:hover {
      background: #70f8ff;
    }

    .comments-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .comment-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 14px;
      display: flex;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--border-color);
      flex-shrink: 0;
    }

    .comment-content {
      flex: 1;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .username {
      font-weight: bold;
      color: #fff;
    }

    .comment-text {
      margin: 0 0 10px 0;
      color: var(--subtext-color);
      word-break: break-word;
    }

    .like-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: #ff4d4d;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }

    .like-btn:hover {
      background: rgba(255, 77, 77, 0.1);
    }

    footer {
      margin-top: auto;
      text-align: center;
      padding: 20px 0;
      border-top: 1px solid var(--border-color);
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    footer a {
      color: var(--accent-color);
      text-decoration: none;
      margin-left: 6px;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <header>
    <h1>GD Level Requests</h1>
    <p class="description">Wait until September 19 for the results</p>
  </header>

  <div class="video-container">
    <video controls poster="">
      <source src="LevelReq.mp4" type="video/mp4">
      Twoja przeglądarka nie wspiera odtwarzacza wideo.
    </video>
  </div>

  <section class="comments-section">
    <h3 style="margin-top: 0;">Submit Request / Comment</h3>
    
    <form class="comment-form" id="comment-form">
      <input type="text" id="username" placeholder="Username (Optional, defaults to Anonymous)">
      <input type="url" id="pfp" placeholder="PFP Image URL (Optional)">
      <textarea id="comment-text" placeholder="Write your request or comment..." rows="3" required></textarea>
      <button type="submit" class="submit-btn">Post Comment</button>
    </form>

    <div class="comments-list" id="comments-list"></div>
  </section>

  <footer>
    KrisPolaris 2024-2026 | <a href="https://tinyurl.com/bebzun" target="_blank" rel="noopener noreferrer">Dont ask</a>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      doc, 
      setDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp,
      increment 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config pointing to bebechchat
    const firebaseConfig = {
      projectId: "bebechchat",
      authDomain: "bebechchat.firebaseapp.com",
      // Add your apiKey here from Firebase Console if needed for client writes
      apiKey: "YOUR_FIREBASE_API_KEY" 
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const commentsCol = collection(db, "comments");
    const likesCol = collection(db, "comments", "likes", "counts"); // Subpath /comments/likes/

    const DEFAULT_AVATAR = "https://i.imgur.com/6VBx3io.png"; // Fallback GD-style avatar

    // Real-time updates for comments
    const q = query(commentsCol, orderBy("createdAt", "desc"));
    
    onSnapshot(q, (snapshot) => {
      const list = document.getElementById("comments-list");
      list.innerHTML = "";
      
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const commentId = docSnap.id;
        
        const card = document.createElement("div");
        card.className = "comment-card";
        
        const pfpSrc = data.pfp && data.pfp.trim() !== "" ? data.pfp : DEFAULT_AVATAR;
        const author = data.username && data.username.trim() !== "" ? data.username : "Anonymous";

        card.innerHTML = `
          <img class="avatar" src="${escapeHtml(pfpSrc)}" onerror="this.src='${DEFAULT_AVATAR}'" alt="PFP">
          <div class="comment-content">
            <div class="comment-header">
              <span class="username">${escapeHtml(author)}</span>
              <button class="like-btn" onclick="likeComment('${commentId}')">
                ❤️ <span id="like-count-${commentId}">0</span>
              </button>
            </div>
            <p class="comment-text">${escapeHtml(data.text)}</p>
          </div>
        `;
        list.appendChild(card);

        // Listen for real-time likes in /comments/likes/
        onSnapshot(doc(likesCol, commentId), (likeSnap) => {
          const countSpan = document.getElementById(`like-count-${commentId}`);
          if (countSpan) {
            countSpan.innerText = likeSnap.exists() ? (likeSnap.data().count || 0) : 0;
          }
        });
      });
    });

    // Form Submission
    document.getElementById("comment-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const username = document.getElementById("username").value.trim();
      const pfp = document.getElementById("pfp").value.trim();
      const text = document.getElementById("comment-text").value.trim();

      if (!text) return;

      await addDoc(commentsCol, {
        username: username,
        pfp: pfp,
        text: text,
        createdAt: serverTimestamp()
      });

      document.getElementById("comment-form").reset();
    });

    // Global like function targeted to /comments/likes/
    window.likeComment = async function(commentId) {
      const likeRef = doc(likesCol, commentId);
      await setDoc(likeRef, { count: increment(1) }, { merge: true });
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }
  </script>
</body>
</html>
